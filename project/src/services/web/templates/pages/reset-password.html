{{ define "content" }}
<style>
  [x-cloak] { display: none !important; }
  .login-card-shadow {
    box-shadow: 0 20px 25px -5px rgba(249, 115, 22, 0.1), 0 8px 10px -6px rgba(249, 115, 22, 0.1);
  }
  .login-card-shadow:hover {
    box-shadow: 0 25px 50px -12px rgba(249, 115, 22, 0.15);
  }
  .login-btn-gradient {
    background: linear-gradient(to right, #f97316, #d97706);
  }
  .login-btn-gradient:hover {
    background: linear-gradient(to right, #ea580c, #b45309);
  }
  .input-ring-focus:focus {
    box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1);
    border-color: #f97316;
  }
  .group:focus-within .icon-focus {
    color: #f97316;
  }
</style>

<div
  x-data="resetPasswordForm({{ if .success }}true{{ else }}false{{ end }})"
  class="w-full max-w-md space-y-8 rounded-2xl border border-gray-100 bg-white p-10 login-card-shadow transition-all duration-300"
>
  <div class="text-center space-y-2">
    <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-orange-100 text-orange-600 mb-4">
      <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
      </svg>
    </div>
    <h2 class="text-3xl font-bold tracking-tight text-gray-900">Redefinir senha</h2>
    <p class="text-sm text-gray-500">Crie uma nova senha para sua conta.</p>
  </div>

  {{ if .error }}
  <div
    x-transition
    class="flex items-center gap-3 rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-700 animate-pulse"
  >
    <svg class="h-5 w-5 flex-shrink-0 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span class="font-medium">{{ .error }}</span>
  </div>
  {{ end }}

  {{ if .success }}
  <div
    x-show="showToast"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 translate-y-2"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 translate-y-0"
    x-transition:leave-end="opacity-0 translate-y-2"
    class="fixed right-4 top-4 z-50 flex items-center gap-3 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-700 shadow-lg"
  >
    <svg class="h-5 w-5 flex-shrink-0 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span class="font-medium">{{ .success }}</span>
  </div>
  {{ end }}

  {{ if .link_uuid }}
  <form method="POST" action="/reset-senha/{{ .link_uuid }}" class="space-y-6" @submit="submit">
    <div class="space-y-2">
      <label class="text-sm font-medium text-gray-700">Nova senha</label>
      <div class="relative group">
        <div
          class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 transition-colors duration-200 icon-focus"
          :class="touched.password && !passwordValid ? 'text-red-400' : 'text-gray-400'"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <input
          type="password"
          name="password"
          required
          placeholder="••••••••"
          class="w-full rounded-xl border py-3 pl-10 pr-4 text-sm transition-all duration-200 focus:outline-none input-ring-focus placeholder-gray-400"
          x-model="password"
          x-on:blur="touched.password = true"
          :class="touched.password && !passwordValid
                        ? 'border-red-300 bg-red-50 focus:border-red-500 focus:ring-red-500/10'
                        : 'border-gray-200 bg-gray-50 focus:bg-white hover:border-orange-300'"
        />
      </div>
      <p
        x-show="touched.password && !passwordValid"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 -translate-y-1"
        x-transition:enter-end="opacity-100 translate-y-0"
        class="flex items-center gap-1 text-xs font-medium text-red-600 pl-1"
      >
        <svg class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
        A senha deve ter pelo menos 6 caracteres
      </p>
    </div>

    <div class="space-y-2">
      <label class="text-sm font-medium text-gray-700">Confirmar nova senha</label>
      <div class="relative group">
        <div
          class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 transition-colors duration-200 icon-focus"
          :class="touched.passwordConfirm && !passwordsMatch ? 'text-red-400' : 'text-gray-400'"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <input
          type="password"
          name="password_confirm"
          required
          placeholder="••••••••"
          class="w-full rounded-xl border py-3 pl-10 pr-4 text-sm transition-all duration-200 focus:outline-none input-ring-focus placeholder-gray-400"
          x-model="passwordConfirm"
          x-on:blur="touched.passwordConfirm = true"
          :class="touched.passwordConfirm && !passwordsMatch
                        ? 'border-red-300 bg-red-50 focus:border-red-500 focus:ring-red-500/10'
                        : 'border-gray-200 bg-gray-50 focus:bg-white hover:border-orange-300'"
        />
      </div>
      <p
        x-show="touched.passwordConfirm && !passwordsMatch"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0 -translate-y-1"
        x-transition:enter-end="opacity-100 translate-y-0"
        class="flex items-center gap-1 text-xs font-medium text-red-600 pl-1"
      >
        <svg class="h-3.5 w-3.5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
        As senhas não coincidem
      </p>
    </div>

    <input type="hidden" name="_csrf" value="{{ .csrf }}" />

    <button
      type="submit"
      class="group relative w-full overflow-hidden rounded-xl login-btn-gradient py-3 text-sm font-semibold text-white shadow-md transition-all duration-200 hover:shadow-lg disabled:cursor-not-allowed disabled:opacity-70 disabled:shadow-none"
      :disabled="!formValid || loading"
    >
      <span class="relative flex items-center justify-center gap-2" x-show="!loading">
        Atualizar senha
        <svg class="h-4 w-4 transition-transform duration-200 group-hover:translate-x-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
      </span>
      <span class="absolute inset-0 flex items-center justify-center gap-2" x-show="loading" x-cloak>
        <svg class="h-5 w-5 animate-spin text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Atualizando...
      </span>
    </button>
  </form>
  {{ end }}

  <div class="pt-4 text-center">
    <a href="/login" class="text-sm font-medium text-orange-600 hover:text-orange-700 hover:underline transition-colors duration-200">
      Voltar ao login
    </a>
  </div>
</div>

<script>
  function resetPasswordForm(initialToast) {
    return {
      password: "",
      passwordConfirm: "",
      loading: false,
      showToast: false,
      touched: {
        password: false,
        passwordConfirm: false,
      },

      init() {
        if (initialToast) {
          sessionStorage.setItem("reset_password_success", "1");
        }
        if (sessionStorage.getItem("reset_password_success")) {
          this.showToast = true;
          sessionStorage.removeItem("reset_password_success");
          setTimeout(() => {
            this.showToast = false;
          }, 4000);
        }
      },

      get passwordValid() {
        return this.password.length >= 6;
      },

      get passwordsMatch() {
        return this.password === this.passwordConfirm;
      },

      get formValid() {
        return this.passwordValid && this.passwordsMatch;
      },

      submit(event) {
        if (!this.formValid) {
          event.preventDefault();
          this.touched.password = true;
          this.touched.passwordConfirm = true;
          return;
        }
        this.loading = true;
      }
    };
  }
</script>
{{ end }}
